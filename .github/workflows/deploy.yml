# Builds the game and its Storybook and publishes them on GitHub Pages on every push to main.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Pages serves a project site under /<repo>/.
          BASE_PATH: /${{ github.event.repository.name }}/
      # Storybook beside the game, at /<repo>/storybook/ - after the game's build, which empties dist/.
      # Its paths are relative, so it needs no base path; the game's worker leaves it alone (vite.config.ts).
      - run: npm run build-storybook -- --output-dir dist/storybook --quiet
        env:
          STORYBOOK_DISABLE_TELEMETRY: 1
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
